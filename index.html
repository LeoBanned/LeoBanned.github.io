<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocodile Gena Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        /* Декоративные светящиеся круги на фоне */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            filter: blur(80px);
            z-index: 0;
        }
        body::before { width: 300px; height: 300px; top: 10%; left: 10%; }
        body::after { width: 400px; height: 400px; bottom: 10%; right: 10%; }

        .container {
            position: relative;
            z-index: 1;
            padding: 2rem;
            max-width: 600px;
        }
        .logo-box {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #34d399, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.15rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2), 0 2px 4px -1px rgba(16, 185, 129, 0.1);
        }
        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">🐊</div>
        <div class="badge">Бренд в разработке</div>
        <h1>Crocodile Gena Studio</h1>
        <p>Мы создаем цифровые решения, которые заставляют проекты двигаться вперед. Наш новый сайт уже готовится к запуску.</p>
        <a href="mailto:cresier0@gmail.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
